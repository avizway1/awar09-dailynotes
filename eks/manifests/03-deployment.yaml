apiVersion: apps/v1
kind: Deployment
metadata:
  name: mynginx
  annotations:
    kubernetes.io/change-cause: "updating to newer version"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: myfirstcontainer
        image: nginx:1.31.3
        ports:
        - containerPort: 80