apiVersion: apps/v1
kind: Deployment
metadata:
  name: mynginx-withlimit
  annotations:
    kubernetes.io/change-cause: "updating to newer version"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-wl
  template:
    metadata:
      labels:
        app: nginx-wl
    spec:
      containers:
      - name: myfirstcontainer
        image: nginx:1.31.3
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "200m"